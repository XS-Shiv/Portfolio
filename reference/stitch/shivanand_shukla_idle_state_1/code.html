<script>
  (function initInteractiveStage() {
    const stage = document.getElementById('monitor-target');
    if (!stage) return;

    let isTransitioning = false;

    const triggerActivation = () => {
      if (isTransitioning) return;
      isTransitioning = true;
      
      stage.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease';
      stage.style.transform = 'scale(0.985)';
      stage.style.filter = 'brightness(1.15) contrast(1.05)';

      setTimeout(() => {
        stage.style.transform = 'scale(1.025)';
        stage.style.filter = 'brightness(1)';
      }, 150);

      const navLink = document.querySelector('header a[data-path="contact"]');
      setTimeout(() => {
        if (navLink) {
          navLink.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        }
      }, 420);
    };

    stage.addEventListener('click', triggerActivation);
    
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        triggerActivation();
      }
    });

    const body = document.body;
    let timeout;
    window.addEventListener('mousemove', (e) => {
      const xNorm = (e.clientX / window.innerWidth - 0.5) * 12;
      const yNorm = (e.clientY / window.innerHeight - 0.5) * 8;
      
      cancelAnimationFrame(timeout);
      timeout = requestAnimationFrame(() => {
        if (!isTransitioning) {
          stage.style.transform = `translate3d(${xNorm * 0.4}px, ${yNorm * 0.3}px, 0)`;
        }
      });
    });
  })();
</script>
