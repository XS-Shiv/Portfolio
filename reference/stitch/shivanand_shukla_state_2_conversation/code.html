<!-- Audio Context Placeholder & Synthesized Sound Setup -->
<script>
    window.crtSoundState = { muted: true };
    function toggleAudio() {
      window.crtSoundState.muted = !window.crtSoundState.muted;
      const soundOnBtn = document.getElementById('btn-sound-on');
      const soundMuteBtn = document.getElementById('btn-sound-mute');
      if (window.crtSoundState.muted) {
        soundOnBtn.className = "w-9 h-9 rounded-full flex items-center justify-center text-on-primary-container transition-all hover:text-on-primary";
        soundMuteBtn.className = "w-9 h-9 rounded-full bg-surface-container-lowest text-primary flex items-center justify-center shadow-sm transition-all";
      } else {
        soundOnBtn.className = "w-9 h-9 rounded-full bg-surface-container-lowest text-primary flex items-center justify-center shadow-sm transition-all";
        soundMuteBtn.className = "w-9 h-9 rounded-full flex items-center justify-center text-on-primary-container transition-all hover:text-on-primary";
      }
    }

    function switchPrompt(text, btnElement) {
      const activeText = document.getElementById('active-dialogue');
      const prevText = document.getElementById('previous-dialogue');
      if (activeText && prevText) {
        prevText.textContent = activeText.textContent;
        activeText.textContent = text;
      }
      document.querySelectorAll('.reply-pill').forEach(pill => {
        pill.className = "reply-pill w-fit h-11 px-6 rounded-full bg-transparent text-primary hover:bg-primary hover:text-on-primary transition-all duration-300 flex items-center font-body-lg text-body-lg tracking-[-0.02em]";
      });
      if (btnElement) {
        btnElement.className = "reply-pill w-fit h-11 px-6 rounded-full bg-primary text-on-primary transition-all duration-300 flex items-center font-body-lg text-body-lg tracking-[-0.02em]";
      }
    }
  </script>

<div class="absolute top-10 left-1/2 -translate-x-1/2 z-40 hidden md:flex items-center gap-6 font-body-lg text-body-lg pointer-events-auto">

<span class="text-outline-variant text-[10px]">·</span>

<!-- Active Statement -->
<h1 class="text-display-lg-mobile md:text-display-lg font-display-lg text-primary tracking-[-0.02em] leading-[1.12] mb-10 transition-all duration-500" id="active-dialogue">

      </h1>
<!-- Reply Pills Stack (Spatial hierarchy & clean interaction) -->
<div class="flex flex-col gap-3.5 items-start">
<button class="reply-pill w-fit h-11 px-6 rounded-full bg-primary text-on-primary transition-all duration-300 flex items-center font-body-lg text-body-lg tracking-[-0.02em] cursor-pointer" onclick="switchPrompt('Here is an index of products, architectures, and platforms I engineered from 0 to 1.', this)">
